name: macOS Signed Build

# Produces a signed, notarized, stapled Willpower.app + DMG.
#
# Signing material comes from repository secrets, using the same names as the
# JobHakken pipeline so one set of Apple credentials can serve both:
#   MAC_CERT            base64 of a Developer ID Application .p12
#   MAC_CERT_PASSWORD   password for that .p12
#   APPLE_ID            Apple ID used for notarization
#   APPLE_PASSWORD      app-specific password for that Apple ID
#   APPLE_TEAM_ID       Developer Team ID
#
# The heavy lifting is delegated to the repo's own scripts/release.sh, so CI and
# a local release stay on exactly the same code path.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 1.0.12)"
        required: true
        type: string
      notarize:
        description: "Notarize and staple (slow; needs Apple credentials)"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run WillpowerKit tests
        working-directory: WillpowerKit
        run: swift test

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # strip the leading "v" from the tag
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Import signing certificate
        env:
          MAC_CERT: ${{ secrets.MAC_CERT }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${MAC_CERT:-}" ]; then
            echo "::error::MAC_CERT secret is not set. See the workflow header for the required secrets."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$MAC_CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          # scripts/codesign.sh and notarytool both look at the default keychain
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

          rm -f "$RUNNER_TEMP/cert.p12"

          # Derive the identity from the cert we just imported rather than
          # hardcoding a name, so whichever Developer ID is in MAC_CERT is used.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')

          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in MAC_CERT."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi

          echo "Signing identity: $IDENTITY"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: ${{ github.event_name == 'push' || inputs.notarize }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::error::APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are all required to notarize."
            exit 1
          fi

          # scripts/notarize.sh expects a stored keychain profile, which is
          # normally created interactively. Create it non-interactively here.
          xcrun notarytool store-credentials "willpower-notary" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --keychain "$KEYCHAIN_PATH"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build, sign, notarize and package
        env:
          SIGNING_IDENTITY: ${{ env.SIGNING_IDENTITY }}
          GITHUB_REPO: ${{ github.repository }}
        run: ./scripts/release.sh "${{ steps.version.outputs.value }}"

      - name: Verify signature and notarization
        run: |
          set -euo pipefail
          APP=$(find releases -name "Willpower.app" -type d | head -1)
          echo "Verifying $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "--- Gatekeeper assessment ---"
          spctl --assess --type execute --verbose=4 "$APP" || \
            echo "::warning::spctl assessment failed (expected if notarization was skipped)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Willpower-${{ steps.version.outputs.value }}
          path: |
            releases/**/*.dmg
            releases/**/Willpower.app
          if-no-files-found: error
          retention-days: 14

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
